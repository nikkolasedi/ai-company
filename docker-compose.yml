services:
  postgres:
    image: postgres:16-alpine
    container_name: ai-company-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ai_company
    volumes:
      - ai_company_pgdata:/var/lib/postgresql/data

volumes:
  ai_company_pgdata:
